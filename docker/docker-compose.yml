services:
  postgres:
    image: postgres:16-alpine
    container_name: gastrosaas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gastrosaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: gastrosaas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
  s3:
    image: rustfs/rustfs:latest
    container_name: gastrosaas-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: adminpassword
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data
volumes:
  pgdata:
  redisdata:
  s3data:
